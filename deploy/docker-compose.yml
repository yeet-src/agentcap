# Local Prometheus + Grafana wired to the agentcap exporter.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   Grafana: http://localhost:3000  (anonymous admin, provisioned dashboard)
#
# Host networking so Prometheus reaches the exporter on 127.0.0.1:9464
# (the service binds loopback only).
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    network_mode: host # scrapes 127.0.0.1:9464, serves :9091
    command:
      # 9091: Cockpit tends to own 9090 on Fedora hosts
      - --web.listen-address=:9091
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    network_mode: host # serves :3000, reads prometheus on :9090
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:

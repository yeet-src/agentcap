# agentcap — Prometheus exporter for AI-agent activity, as a yeet service.
#
#   yeet service import service.toml --now
#   curl http://127.0.0.1:9464/metrics
#
# keeper (eager) holds the collector shared worker — and the BPF probe +
# metric registry inside it — alive; scrape (lazy, per-connection) renders
# one exposition document per request, streamed as the response body via
# the console portal.
alias = "agentcap"
restart = "always"
enabled = true

[units.keeper]
isolate = "./src/main.js"

[units.scrape]
isolate = "./src/scrape.js"
lazy = true

[units.web]
# Bind all interfaces so a Prometheus on another host can scrape it.
# NOTE: this exposes /metrics to the network — restrict with a firewall if
# the box is reachable. Use 127.0.0.1 instead to keep it loopback-only.
web-server = "http://0.0.0.0:9464"

[units.web.routes."/metrics"]
target = "scrape"
portal = "console"
tenancy = "per-connection"
description = "Prometheus exposition of AI-agent activity (agentcap)"
